<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f7fb">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>SOP-Z — Organizador Diário</title>
<script>document.documentElement.dataset.theme=localStorage.getItem("sopz.theme.v1")||"light";</script>
<style>
:root{
  --bg:#f4f7fb;--bg-end:#e9eff7;--panel:#ffffff;--card:#ffffff;--line:#9aabc0;--text:#172033;--muted:#52657a;
  --top-bg:rgba(244,247,251,.94);--active-bg:#dbeafe;--active-text:#153457;--progress-bg:#d7e0eb;
  --desc:#40546a;--badge:#314860;--action-bg:#f0f4f8;--action-text:#18324d;--sheet:#ffffff;--field:#f7f9fc;--field-text:#172033;
  --green:#22c55e;--blue:#38bdf8;--orange:#fb923c;--red:#ef4444;--yellow:#facc15;--purple:#a78bfa;
}
[data-theme="dark"]{
  --bg:#0b1220;--bg-end:#0d1627;--panel:#111827;--card:#172033;--line:#2b3950;--text:#f8fafc;--muted:#9fb0c7;
  --top-bg:rgba(11,18,32,.93);--active-bg:#1b2940;--active-text:#ffffff;--progress-bg:#0f172a;
  --desc:#c4d0df;--badge:#d7e3f3;--action-bg:#121b2a;--action-text:#dbeafe;--sheet:#101827;--field:#0b1220;--field-text:#ffffff;
}
*{box-sizing:border-box} body{margin:0;background:linear-gradient(180deg,var(--bg) 0%,var(--bg-end) 100%);color:var(--text);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit}
.app{max-width:820px;margin:auto;padding:calc(14px + env(safe-area-inset-top)) 12px calc(90px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:20;background:var(--top-bg);backdrop-filter:blur(14px);padding:8px 0 12px}
.head{display:flex;gap:10px;align-items:center;justify-content:space-between}
.logo{display:flex;gap:10px;align-items:center}.mark{width:42px;height:42px;border-radius:14px;border:2px solid #43d17c;display:grid;place-items:center;font-weight:900;background:var(--card)}
h1{font-size:19px;margin:0}.sub{font-size:12px;color:var(--muted)}
.actions{display:flex;gap:8px}.iconbtn{border:1px solid var(--line);color:var(--text);background:var(--card);border-radius:12px;padding:10px 12px}
.mode{display:flex;gap:8px;margin-top:10px}.mode button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:12px;padding:10px;font-weight:800}
.mode button.active{color:var(--active-text);border-color:#3a5b80;background:var(--active-bg)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px}.stat b{display:block;font-size:20px}.stat span{font-size:11px;color:var(--muted)}
.progress{height:9px;border-radius:999px;background:var(--progress-bg);border:1px solid var(--line);overflow:hidden}.progress>div{height:100%;background:linear-gradient(90deg,#22c55e,#38bdf8);width:0}
.toolbar{display:grid;grid-template-columns:1fr auto;gap:8px;margin:12px 0}.search{width:100%;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:11px}
.chiprow{display:flex;gap:8px;overflow:auto;padding:2px 0 8px}.chip{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;padding:7px 10px}.chip.active{color:var(--active-text);background:var(--active-bg)}
section{margin:18px 0}.sec-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.sec-title h2{font-size:13px;letter-spacing:.08em;margin:0;color:var(--text)}.count{font-size:11px;color:var(--muted)}
.cards{display:grid;gap:10px}.card{border:1px solid var(--line);background:var(--card);border-radius:18px;padding:14px;box-shadow:0 8px 24px rgba(0,0,0,.12)}
.card.critical{border-color:#7f1d1d}.card.partial{border-color:#854d0e}.card.deferred{opacity:.8}.row{display:flex;gap:10px;align-items:flex-start}.dot{width:12px;height:12px;border-radius:50%;margin-top:5px;background:#64748b;flex:0 0 auto}.pmrv{background:var(--blue)}.marzom{background:var(--orange)}.financeiro{background:var(--red)}.pessoal{background:var(--green)}.tecnologia{background:var(--purple)}.cobrancas{background:var(--yellow)}.admin{background:#cbd5e1}.shopee{background:#f59e0b}
.meta{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:800}.title{font-size:16px;font-weight:850;margin:3px 0}.desc{font-size:13px;color:var(--desc)}.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.badge{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:4px 8px;color:var(--badge)}.badge.overdue{border-color:#b91c1c;color:#b91c1c}.badge.today{border-color:#a16207;color:#854d0e}.status{font-weight:800}
.btns{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:12px}.btns button{min-height:42px;border-radius:10px;border:1px solid var(--line);background:var(--action-bg);color:var(--action-text);font-weight:800;font-size:11px;padding:6px}.btns button.primary{background:#dcfce7;color:#14532d;border-color:#22c55e}.btns button.danger{background:#fee2e2;color:#7f1d1d;border-color:#ef4444}
[data-theme="dark"] .badge.overdue{border-color:#7f1d1d;color:#fecaca}[data-theme="dark"] .badge.today{border-color:#854d0e;color:#fde68a}[data-theme="dark"] .btns button.primary{background:#173c2a;color:#dbeafe;border-color:#286846}[data-theme="dark"] .btns button.danger{background:#3a1717;color:#dbeafe;border-color:#672020}
.empty{padding:18px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}
.fab{position:fixed;right:18px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:30;border:none;background:#22c55e;color:#06230f;border-radius:999px;padding:15px 18px;font-weight:900;box-shadow:0 12px 30px rgba(34,197,94,.3)}
.modal{position:fixed;inset:0;z-index:50;background:rgba(3,7,18,.72);display:none;align-items:flex-end}.modal.show{display:flex}.sheet{width:100%;max-width:820px;margin:auto;background:var(--sheet);border:1px solid var(--line);border-radius:24px 24px 0 0;padding:16px 14px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.field{display:grid;gap:5px;margin:9px 0}.field label{font-size:12px;color:var(--muted);font-weight:700}.field input,.field textarea,.field select{width:100%;background:var(--field);color:var(--field-text);border:1px solid var(--line);border-radius:11px;padding:11px}.save{width:100%;border:none;background:#22c55e;color:#06230f;border-radius:12px;padding:13px;font-weight:900}.secondary{width:100%;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:12px;font-weight:800;margin-top:8px}
.install{display:none;margin-top:10px;width:100%;border:1px solid #286846;background:#143223;color:#bbf7d0;border-radius:12px;padding:10px;font-weight:800}
@media(max-width:600px){.stats{grid-template-columns:repeat(2,1fr)}.btns{grid-template-columns:repeat(2,1fr)}.btns button:last-child{grid-column:span 2}.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="head">
      <div class="logo"><div class="mark">Z</div><div><h1>SOP-Z</h1><div class="sub" id="dateLabel"></div></div></div>
      <div class="actions"><button class="iconbtn" id="themeBtn" aria-label="Ativar modo escuro" title="Ativar modo escuro">🌙</button><button class="iconbtn" id="exportBtn">⇩</button><button class="iconbtn" id="settingsBtn">⚙</button></div>
    </div>
    <div class="mode"><button id="folgaBtn" class="active">MODO FOLGA</button><button id="plantaoBtn">MODO PLANTÃO</button></div>
    <button id="installBtn" class="install">⬇ Instalar SOP-Z no Android</button>
  </div>

  <div class="stats">
    <div class="stat"><b id="activeN">0</b><span>ATIVAS</span></div>
    <div class="stat"><b id="partialN">0</b><span>PARCIAIS</span></div>
    <div class="stat"><b id="deferredN">0</b><span>ADIADAS</span></div>
    <div class="stat"><b id="doneN">0</b><span>CONCLUÍDAS</span></div>
  </div>
  <div class="progress"><div id="prog"></div></div>

  <div class="toolbar">
    <input class="search" id="search" placeholder="Buscar tarefa...">
    <button class="iconbtn" id="focusBtn">🎯 3</button>
  </div>
  <div class="chiprow" id="filters"></div>

  <div id="sections"></div>
</div>

<button class="fab" id="addBtn">＋ Nova tarefa</button>

<div class="modal" id="modal">
  <div class="sheet">
    <div class="head"><div><h1 id="modalTitle">Nova tarefa</h1><div class="sub">Rápido, objetivo e editável.</div></div><button class="iconbtn" id="closeModal">✕</button></div>
    <div class="field"><label>Tarefa</label><input id="fTitle" placeholder="Ex.: Comprar mangueira WAP"></div>
    <div class="field"><label>Detalhes</label><textarea id="fDesc" rows="2" placeholder="Observações opcionais"></textarea></div>
    <div class="grid2">
      <div class="field"><label>Área</label><select id="fArea">
        <option>PMRv</option><option>Marzom</option><option>Financeiro</option><option>Pessoal</option><option>Tecnologia</option><option>Cobranças</option><option>Administrativo</option><option>Shopee</option>
      </select></div>
      <div class="field"><label>Prioridade</label><select id="fPriority"><option>Crítica</option><option>Urgente</option><option selected>Normal</option><option>Estratégica</option></select></div>
    </div>
    <div class="grid2">
      <div class="field"><label>Data</label><input id="fDate" type="date"></div>
      <div class="field"><label>Bloco</label><select id="fSection"><option value="agora">🔥 AGORA</option><option value="hoje">📌 HOJE</option><option value="pendencias">⏰ PENDÊNCIAS</option><option value="futuro">📆 FUTURO</option></select></div>
    </div>
    <button class="save" id="saveTask">Salvar tarefa</button>
    <button class="secondary" id="deleteTask" style="display:none">Excluir tarefa</button>
  </div>
</div>

<div class="modal" id="settingsModal">
  <div class="sheet">
    <div class="head"><div><h1>Configurações</h1><div class="sub">Dados ficam neste aparelho.</div></div><button class="iconbtn" id="closeSettings">✕</button></div>
    <button class="secondary" id="importBtn">Importar backup JSON</button>
    <button class="secondary" id="resetBtn">Restaurar tarefas iniciais</button>
    <input id="importFile" type="file" accept="application/json" style="display:none">
  </div>
</div>

<script>
const KEY="sopz.tasks.v1", MODEKEY="sopz.mode.v1", THEMEKEY="sopz.theme.v1";
const initial=[
 {id:"t1",section:"agora",area:"PMRv",priority:"Crítica",title:"PMSC MOBILE / FTR",desc:"Prazo vencido em 04/09 — concluir levantamento imediatamente.",status:"pending",date:"2026-09-05"},
 {id:"t2",section:"agora",area:"PMRv",priority:"Crítica",title:"Fechamento AGO/26",desc:"Etapa Alimentação + escalas + SIGRH + relatórios/PRE.",status:"partial",date:"2026-09-05"},
 {id:"t3",section:"agora",area:"Financeiro",priority:"Urgente",title:"CONTAS A PAGAR",desc:"Revisar e quitar contas prioritárias/vencidas.",status:"pending",date:"2026-09-05"},
 {id:"t4",section:"hoje",area:"PMRv",priority:"Normal",title:"Volta Ciclística — concluir detalhes / Capitão",desc:"Fechar detalhes restantes e responder ao Capitão.",status:"pending",date:"2026-09-05"},
 {id:"t5",section:"hoje",area:"PMRv",priority:"Normal",title:"Semana da Pátria — verificar execução",desc:"Confirmar execução e cobrar eventual pendência.",status:"pending",date:"2026-09-05"},
 {id:"t6",section:"hoje",area:"Marzom",priority:"Urgente",title:"NF-e / expedição",desc:"Garantir emissão das notas e andamento da expedição.",status:"pending",date:"2026-09-05"},
 {id:"t7",section:"hoje",area:"Pessoal",priority:"Normal",title:"MARCAR EXAMES",desc:"Agendar os exames necessários.",status:"pending",date:"2026-09-05"},
 {id:"t8",section:"hoje",area:"Pessoal",priority:"Normal",title:"Comprar mangueira WAP",desc:"Comprar mangueira para a WAP.",status:"pending",date:"2026-09-05"},
 {id:"t9",section:"hoje",area:"Marzom",priority:"Estratégica",title:"Preparar promoção para 9.9",desc:"Planejar produtos, preços e condições.",status:"pending",date:"2026-09-05"},
 {id:"t10",section:"hoje",area:"Marzom",priority:"Estratégica",title:"Inserir produtos",desc:"Cadastrar produtos para campanha e operação.",status:"pending",date:"2026-09-05"},
 {id:"t11",section:"pendencias",area:"Cobranças",priority:"Normal",title:"Crepaldi",desc:"Realizar cobrança/regularização.",status:"pending"},
 {id:"t12",section:"pendencias",area:"Cobranças",priority:"Normal",title:"Blanco",desc:"Realizar cobrança/regularização.",status:"pending"},
 {id:"t13",section:"pendencias",area:"Cobranças",priority:"Normal",title:"NF-e Confraria",desc:"Emitir/conferir NF-e.",status:"pending"},
 {id:"t14",section:"pendencias",area:"Administrativo",priority:"Normal",title:"Documento SGPe",desc:"Finalizar e encaminhar.",status:"pending"},
 {id:"t15",section:"pendencias",area:"Shopee",priority:"Normal",title:"NF de devolução Shopee",desc:"Emitir e conferir.",status:"pending"},
 {id:"t16",section:"pendencias",area:"Shopee",priority:"Normal",title:"Recursos das SOPs",desc:"Finalizar fundamentação e protocolo.",status:"pending"},
 {id:"t17",section:"pendencias",area:"Tecnologia",priority:"Normal",title:"Curso Many",desc:"Avançar no curso.",status:"pending"},
 {id:"t18",section:"pendencias",area:"Tecnologia",priority:"Normal",title:"Curso IA",desc:"Avançar no curso de IA.",status:"pending"},
 {id:"t19",section:"pendencias",area:"Tecnologia",priority:"Normal",title:"Organizar Google Drive",desc:"Organização e auditoria sem exclusões.",status:"pending"},
 {id:"t20",section:"pendencias",area:"Tecnologia",priority:"Normal",title:"AnyDesk",desc:"Configurar e testar.",status:"pending"},
 {id:"t21",section:"pendencias",area:"Marzom",priority:"Estratégica",title:"Bling → Olist / anúncios",desc:"Migração e avanço rumo a 100 anúncios.",status:"pending"},
 {id:"t22",section:"pendencias",area:"Marzom",priority:"Normal",title:"Ver valor Mazzuco",desc:"Conferir valor pendente.",status:"pending"},
 {id:"t23",section:"pendencias",area:"PMRv",priority:"Normal",title:"Confirmar acesso à escala",desc:"Questionar ao grupo se todos possuem acesso.",status:"pending"},
 {id:"t24",section:"pendencias",area:"Marzom",priority:"Normal",title:"Baston e outros — Eraldo",desc:"Levantar materiais.",status:"pending"},
 {id:"t25",section:"pendencias",area:"Marzom",priority:"Normal",title:"Luvas e materiais — Inoven / Nobre",desc:"Levantar materiais.",status:"pending"},
 {id:"t26",section:"pendencias",area:"Administrativo",priority:"Normal",title:"Preparar instruções",desc:"Organizar instruções pendentes.",status:"pending"},
 {id:"t27",section:"pendencias",area:"PMRv",priority:"Normal",title:"Escala de Instrução",desc:"Preparar/conferir escala.",status:"pending"},
 {id:"t28",section:"futuro",area:"Pessoal",priority:"Normal",title:"Atendimento — Geraldo Martelinho",desc:"15/09/2026 às 09h • Criciúma/SC.",status:"pending",date:"2026-09-15"}
];

let tasks=JSON.parse(localStorage.getItem(KEY)||"null")||structuredClone(initial);
let mode=localStorage.getItem(MODEKEY)||"folga";
let theme=localStorage.getItem(THEMEKEY)||"light";
let filter="Todas", focusOnly=false, editing=null, deferredPrompt=null;

const $=s=>document.querySelector(s);
const esc=s=>(s??"").replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]));
const save=()=>localStorage.setItem(KEY,JSON.stringify(tasks));
const cls=a=>({PMRv:"pmrv",Marzom:"marzom",Financeiro:"financeiro",Pessoal:"pessoal",Tecnologia:"tecnologia",Cobranças:"cobrancas",Administrativo:"admin",Shopee:"shopee"}[a]||"admin");
const statLabel=s=>({pending:"Pendente",partial:"Parcial",deferred:"Adiada",done:"Concluída",cancelled:"Cancelada"}[s]||s);

function applyTheme(){
 document.documentElement.dataset.theme=theme;
 const dark=theme==="dark", btn=$("#themeBtn");
 btn.textContent=dark?"☀":"🌙";
 btn.setAttribute("aria-label",dark?"Ativar modo claro":"Ativar modo escuro");
 btn.title=btn.getAttribute("aria-label");
 document.querySelector('meta[name="theme-color"]').content=dark?"#0f172a":"#f4f7fb";
}

function render(){
 const today=new Date(); $("#dateLabel").textContent=today.toLocaleDateString("pt-BR",{weekday:"long",day:"2-digit",month:"2-digit",year:"numeric"});
 $("#folgaBtn").classList.toggle("active",mode==="folga"); $("#plantaoBtn").classList.toggle("active",mode==="plantao");
 const active=tasks.filter(t=>!["done","cancelled"].includes(t.status)).length;
 const partial=tasks.filter(t=>t.status==="partial").length, deferred=tasks.filter(t=>t.status==="deferred").length, done=tasks.filter(t=>t.status==="done").length;
 $("#activeN").textContent=active; $("#partialN").textContent=partial; $("#deferredN").textContent=deferred; $("#doneN").textContent=done;
 $("#prog").style.width=Math.round(done/Math.max(1,tasks.length)*100)+"%";

 const areas=["Todas",...new Set(tasks.map(t=>t.area))];
 $("#filters").innerHTML=areas.map(a=>`<button class="chip ${filter===a?'active':''}" data-filter="${esc(a)}">${esc(a)}</button>`).join("");

 let view=tasks.filter(t=>filter==="Todas"||t.area===filter);
 const q=$("#search").value.trim().toLowerCase(); if(q)view=view.filter(t=>(t.title+" "+t.desc+" "+t.area).toLowerCase().includes(q));
 if(focusOnly){
   const rank=p=>p==="Crítica"?0:p==="Urgente"?1:p==="Estratégica"?2:3;
   view=view.filter(t=>!["done","cancelled"].includes(t.status)).sort((a,b)=>rank(a.priority)-rank(b.priority)).slice(0,3);
 }
 const sections=[["agora","🔥 AGORA"],["hoje","📌 HOJE"],["pendencias","⏰ PENDÊNCIAS"],["futuro","📆 FUTURO"],["done","✅ CONCLUÍDAS"]];
 let html="";
 for(const [key,label] of sections){
   let list= key==="done" ? view.filter(t=>t.status==="done") : view.filter(t=>t.section===key && t.status!=="done" && t.status!=="cancelled");
   if(!list.length && key==="done") continue;
   html+=`<section><div class="sec-title"><h2>${label}</h2><span class="count">${list.length}</span></div><div class="cards">${list.length?list.map(card).join(""):`<div class="empty">Nenhuma tarefa aqui.</div>`}</div></section>`;
 }
 $("#sections").innerHTML=html;
}

function card(t){
 const overdue=t.date && new Date(t.date+"T12:00:00") < new Date(new Date().toDateString());
 const critical=t.priority==="Crítica"||t.priority==="Urgente";
 return `<article class="card ${critical?'critical':''} ${t.status==='partial'?'partial':''} ${t.status==='deferred'?'deferred':''}" data-id="${t.id}">
 <div class="row"><span class="dot ${cls(t.area)}"></span><div style="flex:1;min-width:0">
 <div class="meta">${esc(t.priority)} · ${esc(t.area)}</div><div class="title">${esc(t.title)}</div><div class="desc">${esc(t.desc)}</div>
 <div class="badges"><span class="badge status">${statLabel(t.status)}</span>${t.date?`<span class="badge ${overdue?'overdue':'today'}">${new Date(t.date+'T12:00:00').toLocaleDateString('pt-BR')}</span>`:""}</div>
 </div><button class="iconbtn edit" data-edit="${t.id}">✎</button></div>
 <div class="btns">
 <button class="primary" data-status="done">✓ CONCLUÍDO</button>
 <button data-status="partial">◐ PARCIAL</button>
 <button data-status="deferred">↪ ADIAR</button>
 <button class="danger" data-status="cancelled">✖ CANCELAR</button>
 <button data-status="pending">↩ VOLTAR</button>
 </div></article>`;
}

function openModal(t=null){
 editing=t?.id||null; $("#modalTitle").textContent=t?"Editar tarefa":"Nova tarefa";
 $("#fTitle").value=t?.title||""; $("#fDesc").value=t?.desc||""; $("#fArea").value=t?.area||"PMRv"; $("#fPriority").value=t?.priority||"Normal";
 $("#fDate").value=t?.date||new Date().toISOString().slice(0,10); $("#fSection").value=t?.section||"hoje";
 $("#deleteTask").style.display=t?"block":"none"; $("#modal").classList.add("show");
}
function closeModal(){ $("#modal").classList.remove("show"); editing=null; }

document.addEventListener("click",e=>{
 const f=e.target.closest("[data-filter]"); if(f){filter=f.dataset.filter;render();return}
 const edit=e.target.closest("[data-edit]"); if(edit){openModal(tasks.find(t=>t.id===edit.dataset.edit));return}
 const st=e.target.closest("[data-status]"); if(st){const card=st.closest(".card"),t=tasks.find(x=>x.id===card.dataset.id);t.status=st.dataset.status;save();render();return}
});
$("#search").addEventListener("input",render); $("#focusBtn").onclick=()=>{focusOnly=!focusOnly;$("#focusBtn").textContent=focusOnly?"🎯 ON":"🎯 3";render()}
$("#folgaBtn").onclick=()=>{mode="folga";localStorage.setItem(MODEKEY,mode);render()}; $("#plantaoBtn").onclick=()=>{mode="plantao";localStorage.setItem(MODEKEY,mode);render()}
$("#themeBtn").onclick=()=>{theme=theme==="light"?"dark":"light";localStorage.setItem(THEMEKEY,theme);applyTheme()};
$("#addBtn").onclick=()=>openModal(); $("#closeModal").onclick=closeModal;
$("#saveTask").onclick=()=>{
 const title=$("#fTitle").value.trim(); if(!title)return alert("Informe o nome da tarefa.");
 const data={title,desc:$("#fDesc").value.trim(),area:$("#fArea").value,priority:$("#fPriority").value,date:$("#fDate").value||null,section:$("#fSection").value,status:"pending"};
 if(editing){Object.assign(tasks.find(t=>t.id===editing),data)} else tasks.push({id:"t"+Date.now(),...data});
 save();closeModal();render();
};
$("#deleteTask").onclick=()=>{if(editing&&confirm("Excluir esta tarefa?")){tasks=tasks.filter(t=>t.id!==editing);save();closeModal();render()}};
$("#settingsBtn").onclick=()=>$("#settingsModal").classList.add("show"); $("#closeSettings").onclick=()=>$("#settingsModal").classList.remove("show");
$("#resetBtn").onclick=()=>{if(confirm("Restaurar tarefas iniciais?")){tasks=structuredClone(initial);save();$("#settingsModal").classList.remove("show");render()}};
$("#exportBtn").onclick=()=>{const blob=new Blob([JSON.stringify(tasks,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="sopz-backup.json";a.click();URL.revokeObjectURL(a.href)};
$("#importBtn").onclick=()=>$("#importFile").click(); $("#importFile").onchange=async e=>{try{tasks=JSON.parse(await e.target.files[0].text());save();render();alert("Backup importado.")}catch{alert("Arquivo inválido.")}};
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredPrompt=e;$("#installBtn").style.display="block"});
$("#installBtn").onclick=async()=>{if(deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;$("#installBtn").style.display="none"}};
if("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js");
applyTheme();
render();
</script>
</body>
</html>
